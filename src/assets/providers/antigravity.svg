<?xml version="1.0" encoding="UTF-8"?>
<!-- Antigravity: an A inside an orbit. The mark is drawn for a dark surface;
     the app re-inks it for the light theme through the provider's logoTone. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Antigravity">
  <defs>
    <linearGradient id="ag-mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fb4ff"/>
      <stop offset="1" stop-color="#3b62d9"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="26" fill="none" stroke="url(#ag-mark)" stroke-width="2.5" opacity=".4"/>
  <path d="M32 11 L47 49 H39 L32 30 L25 49 H17 Z" fill="url(#ag-mark)"/>
  <path d="M11 45 C21 54 43 54 53 45" fill="none" stroke="url(#ag-mark)" stroke-width="3" stroke-linecap="round" opacity=".85"/>
</svg>
